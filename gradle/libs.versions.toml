[versions]
media3 = "1.11.1"
coil = "3.3.0"
okhttp = "4.12.0"

[libraries]
compose-bom = "androidx.compose:compose-bom:2026.02.01"
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui = { module = "androidx.compose.ui:ui" }
tv-material = "androidx.tv:tv-material:1.1.0"
activity-compose = "androidx.activity:activity-compose:1.13.0"
androidx-core = "androidx.core:core-ktx:1.17.0"
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
serialization-json = "org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0"
zxing = "com.google.zxing:core:3.5.3"
junit = "junit:junit:4.13.2"
