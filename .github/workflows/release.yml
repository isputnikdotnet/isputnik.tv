name: Release

# A tag v<version> builds the signed APK and publishes it as a GitHub Release, which is where
# the app's update check and the guide's install link both look.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # The real key's certificate. An APK signed by any other can't update the TVs already out there.
  CERTIFICATE_SHA256: c7cc890ea3c18c8b592bdf90215f2c14260d2c51899433c00754af3915f05460

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3

      - name: The tag matches the version
        run: |
          version=$(grep '^tvVersion=' gradle.properties | cut -d= -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "gradle.properties says $version, the tag says $GITHUB_REF_NAME"; exit 1; }

      - name: Build and test
        env:
          TV_SIGNING_KEYSTORE: ${{ secrets.TV_SIGNING_KEYSTORE }}
          TV_SIGNING_PASSWORD: ${{ secrets.TV_SIGNING_PASSWORD }}
        run: |
          echo "$TV_SIGNING_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export TV_SIGNING_STORE="$RUNNER_TEMP/release.keystore"
          sh gradlew testDebugUnitTest assembleRelease -PrequireKey --console=plain
          rm "$RUNNER_TEMP/release.keystore"

      - name: Signed with the real key
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -q "SHA-256 digest: $CERTIFICATE_SHA256"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Always this name, so the address in the guide never changes.
          apk="iSputnik-TV.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --verify-tag --title "iSputnik TV ${GITHUB_REF_NAME#v}" --notes-from-tag
